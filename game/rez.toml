[hooks]
# Kamui's vertex-buffer send (src/native_gfx.cpp).
0x8C045120 = "km_send_buffer@entry"
# Ninja2's chunk-model drawing, native (src/native_ninja.cpp): the vertex chunk handlers for types
# 41, 34 and 35, strip writer A, the polygon chunk walker and njCnkDrawModel.
0x8C05E240 = "nj_vtx41@entry"
0x8C05E2EC = "nj_vtx34@entry"
0x8C05E07C = "nj_vtx35@entry"
0x8C058E98 = "nj_strip_a@entry"
0x8C01A6C0 = "nj_walk@entry"
0x8C01AF76 = "nj_draw_model@entry"
# Rez's wireframe line renderer, native (src/native_ninja.cpp, rez_lines).
0x8C0ACF7E = "rez_lines@entry"
# The screen positions it reads, from Ninja's object drawing (src/native_ninja.cpp, line_vertices).
0x8C03D7E0 = "rez_line_vertices@entry"
# One wide line cut at the near plane (src/native_ninja.cpp, rez_line).
0x8C030EB4 = "rez_line@entry"
# A model's edges as such lines, the line renderer's other path (src/native_ninja.cpp,
# rez_lines_cut).
0x8C0AD03A = "rez_lines_cut@entry"
# Merging a wireframe model's vertices and edges as a stage is prepared, both quadratic scans
# (src/native_ninja.cpp, wire_vertices and wire_edge).
0x8C0AC9C8 = "rez_wire_vertices@entry"
0x8C0AC94E = "rez_wire_edge@entry"
# Kamui's PVR register accessors, write and read (src/native_gfx.cpp).
0x8C06BB20 = "km_pvr_write@entry"
0x8C06BB2A = "km_pvr_read@entry"
# Kamui's render starts, to the framebuffer and to a texture: which TA context the render draws.
0x8C06F900 = "km_render_start@entry"
0x8C06F800 = "km_render_start@entry"
# kmBeginScene: it takes a vertex buffer; Kamui's lists borrowed from it two renders back are read
# first (src/native_gfx.cpp, km_begin_scene).
0x8C046420 = "km_begin_scene@entry"
# Shinobi's interrupt dispatcher, Kamui's interrupt entry and syChain's registration, natively
# without Holly's interrupt registers (src/native_irq.cpp); syChain's delete and finish guarded
# (never run).
0x8C0328F6 = "irq_dispatch@entry"
0x8C06DEC0 = "irq_kamui@entry"
0x8C0326B0 = "irq_chain_add@entry"
0x8C032A68 = "irq_guard@entry"
0x8C032C54 = "irq_guard@entry"
# Shinobi syTmrGetCount: 0xFFFFFFFF - TCNT0, the game's time base (src/native_sys.cpp).
0x8C01432A = "sy_tmr_get_count@entry"
# Kamui's handler dispatcher, which the vsync wait calls twice a pass (src/native_sys.cpp).
0x8C06F0C0 = "km_dispatch@entry"

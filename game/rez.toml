# Rez V1.003 (Japan HDR-0178, Europe MK-5119250): game config.

[game]
id = "rez"
title = "Rez"
region = "Japan"
product = "HDR-0178"

[disc]
sha1_1st_read = "62f27393c3170001dc987f3ae836461bd63dbd7a"   # SHA-1 of the boot file

# The supported disc images: Redump's CHDs of the Japanese and European releases, by the SHA-1 each
# CHD's header records. Both carry the boot file above; the European one differs only in data the
# game reads at run time. dc.py setup and the game refuse any other image, including a GDI or
# BIN/CUE of the same disc.
[[disc.chd]]
sha1 = "9711a0d0c21af3685672b9a42c72abf999fc7150"
name = "Rez (Japan) (En,Ja,Fr,De,Es,It)"
label = "Japanese"

[[disc.chd]]
sha1 = "01b7c1cc29a840b141a4ae713037eb1224fac233"
name = "Rez (Europe) (En,Ja,Fr,De,Es,It)"
label = "European"

[binary]
path = "extracted/fs/1ST_READ.BIN"   # written by tools/dc.py setup, git-ignored
load_address = 0x8C010000
link_address = 0x8C010000
entry = 0x8C010000

# Exception and interrupt stubs Katana copies below the load address at boot. overlay and no_fold:
# code at these addresses can change.
[[relocations]]   # VBR+0x000
source = 0x8C032FA0
size = 0x34
dest = 0x8C000000
overlay = true
no_fold = true

[[relocations]]   # VBR+0x100 (general exceptions)
source = 0x8C032F0C
size = 0x34
dest = 0x8C000100
overlay = true
no_fold = true

[[relocations]]   # VBR+0x400 (TLB miss): the same stub
source = 0x8C032F0C
size = 0x34
dest = 0x8C000400
overlay = true
no_fold = true

[[relocations]]   # VBR+0x600 (interrupts)
source = 0x8C032F44
size = 0x58
dest = 0x8C000600
overlay = true
no_fold = true

# Code overlays read from disc at run time: file offset 0 sits at the base the file is linked for.
# `entries` are the code pointers in the file's header (word 0, and word 2 in the stage files; word
# 1 there points to a stage descriptor), then code the translator does not reach from those.
# `size`, where given, covers the code the entries reach plus 0x400; otherwise the whole file is
# translated. `dc.py setup` extracts each `file`.
[[relocations]]
file = "extracted/fs/B_EARTH/B_EARTH.BIN"
dest = 0x8C380000
entries = [0x8C380F44, 0x8C3A3D94]
overlay = true


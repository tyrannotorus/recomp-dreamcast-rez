         # seeded so the native gdFs covers the library's whole public API.
         0x8C0117BC, 0x8C0117E4, 0x8C011E40,
         # gdFs's public API stubs at their true entries (each after the previous stub's literal
         # word; the translator enters them at their second instruction), hooked natively.
